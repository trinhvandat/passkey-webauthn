name: Enterprise Deployment (SSM)

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Configure Aws credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{steps.login-ecr.outputs.registry}}
          ECR_REPOSITORY: web-authn-service
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to ECS via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \ 
          --filters "Name=tag:Name,Value=dev-auth-server" "Name=instance-state-name,Values=running" \
          --query "Reservations[*].Instances[*].InstanceId" \
          --output text)

          echo "Deploying to Instance: $INSTANCE_ID"
          
          aws ssm send-command \
          --instance-ids "$INSTANCE_ID"
          --document-name "AWS-RunShellScript" \
          --comment "Deploying Java App" \
          --parameters 'commands=[
            "aws ecr get-login-password --region ap-southeast-1 | docker login --username AWS --password-stdin ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.ap-southeast-1.amazonaws.com",
            "docker stop my-app || true",
            "docker rm my-app || true",
            "docker pull ${{secrets.AWS_ACCOUNT_ID}}.dkr.ecr.ap-southeast-1.amazonaws.com/web-authn-service:latest",
            "docker run -d --name my-app -p 8080:8080 --env-file /home/ec2-user/.env ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com/web-authn-service:latest"
          ]' \
          --region ap-southeast-1



